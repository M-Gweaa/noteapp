<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notes Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        .form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .note {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
        }

        .delete {
            float: right;
        }
    </style>
</head>

<body>

    <h1>📝 Notes Application</h1>

    <div class="form">

        <h2>Create Note</h2>

        <input
            id="title"
            type="text"
            placeholder="Note title"
        >

        <textarea
            id="content"
            placeholder="Write your note..."
        ></textarea>

        <button onclick="createNote()">
            Add Note
        </button>

    </div>

    <h2>My Notes</h2>

    <div id="notes"></div>

    <script>

        async function loadNotes() {

            const response = await fetch("/api/notes");

            const notes = await response.json();

            const container =
                document.getElementById("notes");

            container.innerHTML = "";

            notes.forEach(note => {

                const div = document.createElement("div");

                div.className = "note";

                div.innerHTML = `
                    <button
                        class="delete"
                        onclick="deleteNote(${note.id})">
                        Delete
                    </button>

                    <h3>${note.title}</h3>

                    <p>${note.content}</p>
                `;

                container.appendChild(div);
            });
        }


        async function createNote() {

            const title =
                document.getElementById("title").value;

            const content =
                document.getElementById("content").value;

            if (!title || !content) {

                alert("Please enter title and content.");

                return;
            }

            await fetch("/api/notes", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: title,
                    content: content
                })

            });

            document.getElementById("title").value = "";

            document.getElementById("content").value = "";

            loadNotes();
        }


        async function deleteNote(id) {

            await fetch(`/api/notes/${id}`, {
                method: "DELETE"
            });

            loadNotes();
        }


        loadNotes();

    </script>

</body>

</html>
